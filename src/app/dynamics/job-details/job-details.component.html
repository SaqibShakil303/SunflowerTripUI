<div class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">{{ data.job.title }}</h2>
      <button class="modal-close" (click)="onClose()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="job-details">
        <div class="detail-item">
          <span class="detail-label">Location</span>
          <span class="detail-value">{{ data.job.location || 'N/A' }}</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Department</span>
          <span class="detail-value">{{ data.job.department || 'N/A' }}</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Type</span>
          <span class="detail-value">{{ data.job.type || 'N/A' }}</span>
        </div>
      </div>

      <div class="job-section">
        <h3>Responsibilities</h3>
        <span class="detail-value">{{ data.job.responsibilities || 'N/A' }}</span>
      </div>

      <div class="job-section">
        <h3>Skills Required</h3>
        <span class="detail-value">{{ data.job.requirements || 'N/A' }}</span>
      </div>

      <button class="btn apply-btn" (click)="onApply()">Apply for this Job</button>

      <!-- <app-apply-form *ngIf="showForm" [jobId]="data.job.id"></app-apply-form> -->
    </div>
  </div>
</div>

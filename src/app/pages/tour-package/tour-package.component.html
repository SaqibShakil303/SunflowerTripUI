  <div class="tour-filter-container">
  <section class="tour-filter-section">
    <app-tour-filter
      (searchTriggered)="handleSearch($event)"
    ></app-tour-filter>
  </section>

  <div class="tours-wrapper">
    <!-- LOADING OVERLAY -->
    <div *ngIf="loading" class="loading-overlay">
      Loading tours...
    </div>

    <!-- ERROR -->
    <div *ngIf="!loading && error" class="error">
      {{ error }}
    </div>

    <!-- NO TOURS -->
    <div *ngIf="!loading && !error && tours.length === 0" class="no-tours">
      No tours found matching your filters.
    </div>

    <!-- TOURS (ALWAYS IN DOM) -->
    <div class="tours-grid">
      <div
        *ngFor="let tour of tours; let i = index; trackBy: trackByTour"
        class="tour-card appear-from-left"
        [style.transitionDelay]="i * 120 + 'ms'"
        #tourCard
      >
        <img [src]="tour.image_url" alt="{{ tour.title }}" class="tour-image" />
        <div class="tour-info">
          <h3 class="tour-title">{{ tour.title }}</h3>
          <p class="tour-description">
            {{ tour.description | slice: 0:100 }}...
          </p>
          <div class="tour-meta">
            <span>{{ tour.duration_days }} Days</span>
            <span>₹{{ formatPrice(tour.price) }}</span>
          </div>
          <button class="btn-detail" (click)="goToTourDetail(tour.slug)">
            View Tour
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

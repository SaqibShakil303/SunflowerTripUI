<section class="section tours" id="tours">
  <div class="container">
    <div class="section-title text-center">
      <h2>Featured Tours</h2>
      <p>Embark on unforgettable adventures with our curated selection of tours</p>
    </div>
    <div class="swiper tour-slider" #swiperContainer>
      <div class="swiper-wrapper">
        <div class="swiper-slide" *ngFor="let tour of tours; let i = index">
          <div class="tour-card fade-in-up" [style.--delay]="i">
            <div class="tour-image">
              <img ngSrc=" {{tour.image_url}} " alt=" {{tour.title}} " width="600" height="400" loading="lazy" decoding="async">
            </div>
            <div class="tour-content">
              <h3>{{ tour.title }}</h3>
              <p class="tour-meta">{{ tour.duration_days }} Days | {{ tour.price_currency }} {{ tour.price_per_person }}</p>
              <p class="tour-description">{{ tour.description | slice:0:100 }}...</p>
              <a *ngIf="tour.id" [routerLink]="['/tour', tour.slug]" class="btn-explore">
                Explore Tour
                <i class="fas fa-arrow-right"></i>
              </a>
            </div>
            <div class="wishlist-btn-wrapper" *ngIf="isUserLoggedin && !isInWishlist(tour.id)">
              <button class="wishlist-btn add-wl-btn" (click)="handleAddWishlist({user_id: user.id, tour_id: tour.id})"><i class="far fa-heart"></i></button>
            </div>
            <div class="wishlist-btn-wrapper" *ngIf="isUserLoggedin && isInWishlist(tour.id)">
              <button class="wishlist-btn remove-wl-btn" (click)="handleRemoveWishlist(tour.id)"><i class="fas fa-heart"></i></button>
            </div>
          </div>
        </div>
      </div>
      <div class="swiper-pagination"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>
  </div>
</section>
